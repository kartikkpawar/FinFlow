services:
  postgres-auth:
    image: postgres:17
    container_name: finflow-postgres-auth
    environment:
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow
      POSTGRES_DB: finflow_auth
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d finflow_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-merchants:
    image: postgres:17
    container_name: finflow-postgres-merchants
    environment:
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow
      POSTGRES_DB: finflow_merchants
    ports:
      - "5434:5432"
    volumes:
      - postgres_merchants_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d finflow_merchants"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_auth_data:
  postgres_merchants_data:
